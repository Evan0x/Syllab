services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: syllacal
      POSTGRES_USER: syllacal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      INVITE_CODE: ${INVITE_CODE}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syllacal -d syllacal"]
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/syllacal
      DB_USER: syllacal
      DB_PASSWORD: ${DB_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INVITE_CODE: ${INVITE_CODE}
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  dbdata:
